# Look and feel for the dashboard. Streamlit reads this when started from the project root.
[theme]
base = "light"
primaryColor = "#1F6B3A"
backgroundColor = "#F6F5F0"
secondaryBackgroundColor = "#ECEFE4"
textColor = "#17231C"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#193F2E"
secondaryBackgroundColor = "#1A5233"
textColor = "#F6F5F0"
primaryColor = "#DDEFBA"

[client]
toolbarMode = "minimal"